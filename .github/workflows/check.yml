name: V2Ray TCP Check

on:
  workflow_dispatch: {}       # اجرای دستی از تب Actions
  schedule:
    - cron: "0 0 * * *"       # هر روز ساعت ۰۰:۰۰ UTC

permissions:
  contents: write             # برای اجازه‌ی commit کردن fast_servers.txt

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run TCP checker
        env:
          SUB_LINKS: ${{ secrets.SUB_LINKS }}
        run: python3 v2ray_tcp_checker.py --output fast_servers.txt

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fast_servers.txt
          git diff --staged --quiet || git commit -m "Update fast_servers.txt [skip ci]"
          git push
